name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # hidapi builds against libudev on Linux; macOS uses the system IOKit backend.
      - name: Install Linux HID dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev

      - run: cargo build --release --locked
      - run: cargo clippy --release --all-targets --locked -- -D warnings

      # No device is attached to CI, so only the device-free paths are exercised.
      - run: ./target/release/knobctl validate mapping.example.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: knobctl-${{ matrix.os }}
          path: target/release/knobctl
          if-no-files-found: error
